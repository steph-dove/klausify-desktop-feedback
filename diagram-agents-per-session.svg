<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 236" width="380" height="236" role="img" aria-labelledby="t3 d3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t3">One session, many agents</title>
  <desc id="d3">A single Klaussy session running several coding agents side by side.</desc>
  <defs>
    <marker id="arrow3" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#5b9bff"/>
    </marker>
  </defs>

  <text x="190" y="22" text-anchor="middle" font-family="'SF Mono','Fira Code',Menlo,Consolas,monospace" font-size="12.5" font-weight="500" letter-spacing="0.04em" fill="#9c9ca9">one session &#8594; many agents</text>

  <!-- arrows: one session fans out to three agents -->
  <g fill="none" stroke="#5b9bff" stroke-width="1.5" opacity="0.9">
    <path d="M118,128 C 182,128 198,60 256,60" marker-end="url(#arrow3)"/>
    <path d="M118,128 L 256,128" marker-end="url(#arrow3)"/>
    <path d="M118,128 C 182,128 198,196 256,196" marker-end="url(#arrow3)"/>
  </g>

  <!-- session node (accent) -->
  <rect x="14" y="105" width="104" height="46" rx="10" fill="#2a1015" stroke="#f2384a" stroke-width="1.5"/>
  <text x="66" y="128" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#ecedf1">Session</text>

  <!-- agent nodes (neutral) -->
  <g>
    <rect x="262" y="40" width="104" height="40" rx="10" fill="#17171c" stroke="#3b3b46" stroke-width="1"/>
    <text x="314" y="60" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#ecedf1">Claude Code</text>

    <rect x="262" y="108" width="104" height="40" rx="10" fill="#17171c" stroke="#3b3b46" stroke-width="1"/>
    <text x="314" y="128" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#ecedf1">Codex</text>

    <rect x="262" y="176" width="104" height="40" rx="10" fill="#17171c" stroke="#3b3b46" stroke-width="1"/>
    <text x="314" y="196" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#ecedf1">Gemini</text>
  </g>
</svg>
